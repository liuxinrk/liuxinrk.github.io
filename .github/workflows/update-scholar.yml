name: Update Google Scholar numbers

on:
  schedule:
    - cron: '30 1 * * *'   # every day at 01:30 UTC (09:30 Beijing time)
  workflow_dispatch:         # allows a manual run from the Actions tab

permissions:
  contents: write
  pages: write

concurrency:
  group: update-scholar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Scholar metrics and update index.html
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python3 .github/scripts/update_scholar.py

      - name: Commit and publish if the numbers changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- index.html; then
            echo "Numbers unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update Google Scholar numbers"
          git push
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
